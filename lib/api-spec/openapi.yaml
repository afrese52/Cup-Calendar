openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Public tournament calendar
  - name: admin-import
    description: Admin-only upload and import of tournament schedules
  - name: account
    description: Kontoaktionen für angemeldete Benutzer
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/events:
    get:
      operationId: getEvents
      tags: [events]
      summary: List tournament events
      parameters:
        - name: region
          in: query
          schema:
            type: string
            enum: [EU, NAE, NAW, BR, ASIA, OCE, ME, GLOBAL, ALL]
        - name: game_mode
          in: query
          schema:
            type: string
            enum: [Battle Royale, Zero Build, Reload, Community, ALL]
        - name: tournament_type
          in: query
          schema:
            type: string
            enum: [FNCS, Cash Cup, Ranked Cup, Community, ALL]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Tournament events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
        "400":
          description: Invalid filters
        "503":
          description: Event data is temporarily unavailable
  /v1/admin/import-access:
    get:
      operationId: getAdminImportAccess
      tags: [admin-import]
      summary: Check access to the schedule importer
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Import access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImportAccess"
        "401":
          description: Authentication required
        "403":
          description: Import access is not granted
  /v1/admin/events/import/preview:
    post:
      operationId: previewMhtImport
      tags: [admin-import]
      summary: Preview a saved Fortnite schedule before importing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              $ref: "#/components/schemas/MhtScheduleFile"
      responses:
        "200":
          description: Parsed schedule and import review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MhtImportPreview"
        "400":
          description: The uploaded file could not be parsed
        "401":
          description: Authentication required
        "403":
          description: Import access is not granted
        "413":
          description: The file is too large
        "503":
          description: Supabase is temporarily unavailable
  /v1/admin/events/import:
    post:
      operationId: importMhtSchedule
      tags: [admin-import]
      summary: Import reviewed schedule entries into Supabase
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              $ref: "#/components/schemas/MhtScheduleFile"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MhtImportResult"
        "400":
          description: The uploaded file could not be imported
        "401":
          description: Authentication required
        "403":
          description: Import access is not granted
        "413":
          description: The file is too large
        "503":
          description: Supabase is temporarily unavailable
  /v1/admin/events/import/history:
    get:
      operationId: getAdminImportHistory
      tags: [admin-import]
      summary: List recent imported schedule records
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Recent imports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MhtImportHistoryResponse"
        "401":
          description: Authentication required
        "403":
          description: Import access is not granted
        "503":
          description: Supabase is temporarily unavailable
  /v1/account/deletion/request:
    post:
      operationId: requestAccountDeletion
      tags: [account]
      summary: Erstellt ein kurzlebiges Bestätigungstoken für die Kontolöschung
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Bestätigungstoken für die Kontolöschung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionRequest"
        "401":
          description: Anmeldung erforderlich
        "503":
          description: Kontodienst ist vorübergehend nicht verfügbar
  /v1/account/deletion/confirm:
    post:
      operationId: confirmAccountDeletion
      tags: [account]
      summary: Löscht das angemeldete Konto nach der E-Mail-Bestätigung
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionConfirmation"
      responses:
        "204":
          description: Konto gelöscht
        "400":
          description: Bestätigungstoken ist ungültig oder abgelaufen
        "401":
          description: Anmeldung erforderlich
        "403":
          description: Bestätigungstoken gehört zu einem anderen Konto
        "503":
          description: Konto konnte nicht gelöscht werden
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TournamentEvent:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        region:
          type: string
          enum: [EU, NAE, NAW, BR, ASIA, OCE, ME, GLOBAL]
        gameMode:
          type: string
          enum: [Battle Royale, Zero Build, Reload, Community]
        teamFormat:
          type: string
          enum: [Solo, Duos, Trios, Squads]
        tournamentType:
          type: string
          enum: [FNCS, Cash Cup, Ranked Cup, Community]
        category:
          type: string
          enum: [Turnier, Liga, Qualifikation, Trainingsrunde]
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        featured: { type: boolean }
      required:
        - id
        - title
        - description
        - region
        - gameMode
        - teamFormat
        - tournamentType
        - category
        - startTime
        - endTime
        - featured
    EventListResponse:
      type: object
      properties:
        count: { type: integer }
        data:
          type: array
          items:
            $ref: "#/components/schemas/TournamentEvent"
      required: [count, data]
    AdminImportAccess:
      type: object
      properties:
        authorized: { type: boolean }
        reason:
          type: ["string", "null"]
          enum: [not_configured, not_admin, null]
      required: [authorized, reason]
    AccountDeletionRequest:
      type: object
      properties:
        confirmationToken: { type: string }
        expiresAt: { type: string, format: date-time }
      required: [confirmationToken, expiresAt]
    AccountDeletionConfirmation:
      type: object
      properties:
        confirmationToken: { type: string }
      required: [confirmationToken]
    MhtScheduleFile:
      type: string
      description: UTF-8 text content of an MHT or MHTML schedule snapshot
    MhtImportEvent:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        gameMode:
          type: string
          enum: [Battle Royale, Zero Build, Reload, Community]
        teamFormat:
          type: string
          enum: [Solo, Duos, Trios, Squads]
        tournamentType:
          type: string
          enum: [FNCS, Cash Cup, Ranked Cup, Community]
        category:
          type: string
          enum: [Turnier, Liga, Qualifikation, Trainingsrunde]
        warnings:
          type: array
          items: { type: string }
        willUpdate: { type: boolean }
      required: [id, title, startTime, endTime, gameMode, teamFormat, tournamentType, category, warnings, willUpdate]
    MhtImportIssue:
      type: object
      properties:
        title:
          type: ["string", "null"]
        errors:
          type: array
          items: { type: string }
      required: [title, errors]
    MhtImportPreview:
      type: object
      properties:
        sourceUrl: { type: ["string", "null"] }
        snapshotAt: { type: ["string", "null"], format: date-time }
        snapshotAgeMs: { type: ["integer", "null"], description: Snapshot age in milliseconds when previewed }
        isSnapshotStale: { type: boolean, description: True when the snapshot is more than 24 hours old }
        region: { type: string }
        timeZone: { type: string }
        cardCount: { type: integer }
        upcomingCount: { type: integer }
        importableCount: { type: integer }
        warningCount: { type: integer }
        invalidCount: { type: integer }
        newCount: { type: integer }
        updateCount: { type: integer }
        events:
          type: array
          items: { $ref: "#/components/schemas/MhtImportEvent" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/MhtImportIssue" }
      required: [sourceUrl, snapshotAt, snapshotAgeMs, isSnapshotStale, region, timeZone, cardCount, upcomingCount, importableCount, warningCount, invalidCount, newCount, updateCount, events, issues]
    MhtImportResult:
      type: object
      properties:
        importedCount: { type: integer }
        insertedCount: { type: integer }
        updatedCount: { type: integer }
        skippedWarningCount: { type: integer }
        skippedPastCount: { type: integer }
        skippedCount: { type: integer }
      required: [importedCount, insertedCount, updatedCount, skippedWarningCount, skippedPastCount, skippedCount]
    MhtImportHistoryEntry:
      type: object
      properties:
        id: { type: integer }
        importedAt: { type: string, format: date-time }
        adminUserId: { type: string, format: uuid }
        adminEmail: { type: string, format: email }
        sourceHint: { type: ["string", "null"] }
        insertedCount: { type: integer }
        updatedCount: { type: integer }
        skippedCount: { type: integer }
      required: [id, importedAt, adminUserId, adminEmail, sourceHint, insertedCount, updatedCount, skippedCount]
    MhtImportHistoryResponse:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/MhtImportHistoryEntry" }
      required: [entries]

