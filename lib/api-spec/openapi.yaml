openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: events
    description: Public tournament calendar
  - name: admin-import
    description: Admin-only upload and import of tournament schedules
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /v1/events:
    get:
      operationId: getEvents
      tags: [events]
      summary: List tournament events
      parameters:
        - name: region
          in: query
          schema:
            type: string
            enum: [EU, NAE, NAW, BR, ASIA, OCE, ME, GLOBAL, ALL]
        - name: game_mode
          in: query
          schema:
            type: string
            enum: [Battle Royale, Zero Build, Reload, Community, ALL]
        - name: tournament_type
          in: query
          schema:
            type: string
            enum: [FNCS, Cash Cup, Ranked Cup, Community, ALL]
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Tournament events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventListResponse"
        "400":
          description: Invalid filters
        "503":
          description: Event data is temporarily unavailable
  /v1/admin/import-access:
    get:
      operationId: getAdminImportAccess
      tags: [admin-import]
      summary: Check access to the schedule importer
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Import access status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminImportAccess"
        "401":
          description: Authentication required
        "403":
          description: Import access is not granted
  /v1/admin/events/import/preview:
    post:
      operationId: previewMhtImport
      tags: [admin-import]
      summary: Preview a saved Fortnite schedule before importing
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              $ref: "#/components/schemas/MhtScheduleFile"
      responses:
        "200":
          description: Parsed schedule and import review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MhtImportPreview"
        "400":
          description: The uploaded file could not be parsed
        "401":
          description: Authentication required
        "403":
          description: Import access is not granted
        "413":
          description: The file is too large
        "503":
          description: Supabase is temporarily unavailable
  /v1/admin/events/import:
    post:
      operationId: importMhtSchedule
      tags: [admin-import]
      summary: Import reviewed schedule entries into Supabase
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              $ref: "#/components/schemas/MhtScheduleFile"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MhtImportResult"
        "400":
          description: The uploaded file could not be imported
        "401":
          description: Authentication required
        "403":
          description: Import access is not granted
        "413":
          description: The file is too large
        "503":
          description: Supabase is temporarily unavailable
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TournamentEvent:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        region:
          type: string
          enum: [EU, NAE, NAW, BR, ASIA, OCE, ME, GLOBAL]
        gameMode:
          type: string
          enum: [Battle Royale, Zero Build, Reload, Community]
        teamFormat:
          type: string
          enum: [Solo, Duos, Trios, Squads]
        tournamentType:
          type: string
          enum: [FNCS, Cash Cup, Ranked Cup, Community]
        category:
          type: string
          enum: [Turnier, Liga, Qualifikation, Trainingsrunde]
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        featured: { type: boolean }
      required:
        - id
        - title
        - description
        - region
        - gameMode
        - teamFormat
        - tournamentType
        - category
        - startTime
        - endTime
        - featured
    EventListResponse:
      type: object
      properties:
        count: { type: integer }
        data:
          type: array
          items:
            $ref: "#/components/schemas/TournamentEvent"
      required: [count, data]
    AdminImportAccess:
      type: object
      properties:
        authorized: { type: boolean }
        reason:
          type: ["string", "null"]
          enum: [not_configured, not_admin, null]
      required: [authorized, reason]
    MhtScheduleFile:
      type: string
      description: UTF-8 text content of an MHT or MHTML schedule snapshot
    MhtImportEvent:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        gameMode:
          type: string
          enum: [Battle Royale, Zero Build, Reload, Community]
        teamFormat:
          type: string
          enum: [Solo, Duos, Trios, Squads]
        tournamentType:
          type: string
          enum: [FNCS, Cash Cup, Ranked Cup, Community]
        category:
          type: string
          enum: [Turnier, Liga, Qualifikation, Trainingsrunde]
        warnings:
          type: array
          items: { type: string }
        willUpdate: { type: boolean }
      required: [id, title, startTime, endTime, gameMode, teamFormat, tournamentType, category, warnings, willUpdate]
    MhtImportIssue:
      type: object
      properties:
        title:
          type: ["string", "null"]
        errors:
          type: array
          items: { type: string }
      required: [title, errors]
    MhtImportPreview:
      type: object
      properties:
        sourceUrl: { type: ["string", "null"] }
        snapshotAt: { type: ["string", "null"], format: date-time }
        region: { type: string }
        timeZone: { type: string }
        cardCount: { type: integer }
        upcomingCount: { type: integer }
        importableCount: { type: integer }
        warningCount: { type: integer }
        invalidCount: { type: integer }
        newCount: { type: integer }
        updateCount: { type: integer }
        events:
          type: array
          items: { $ref: "#/components/schemas/MhtImportEvent" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/MhtImportIssue" }
      required: [sourceUrl, snapshotAt, region, timeZone, cardCount, upcomingCount, importableCount, warningCount, invalidCount, newCount, updateCount, events, issues]
    MhtImportResult:
      type: object
      properties:
        importedCount: { type: integer }
        insertedCount: { type: integer }
        updatedCount: { type: integer }
        skippedWarningCount: { type: integer }
        skippedPastCount: { type: integer }
      required: [importedCount, insertedCount, updatedCount, skippedWarningCount, skippedPastCount]

