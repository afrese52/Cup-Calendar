name: CupCal – Supabase-Passwortgrenzen

on:
  push:
    paths:
      - "artifacts/cupcal-mobile/package.json"
      - "artifacts/cupcal-mobile/services/**"
      - "artifacts/cupcal-mobile/app/auth/**"
      - "artifacts/cupcal-mobile/app/(tabs)/settings.tsx"
      - "pnpm-lock.yaml"
      - ".github/workflows/supabase-password-boundaries.yml"
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: cupcal-supabase-password-boundaries
  cancel-in-progress: false

jobs:
  password-boundaries:
    name: Passwortgrenzen am Wegwerf-Konto prüfen
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cupcal-supabase-password-test
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: Passwortgrenzen mit dem markierten Wegwerf-Konto prüfen
        run: pnpm --filter @workspace/cupcal-mobile run test:supabase-password-live
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          CUPCAL_SUPABASE_PASSWORD_TEST_EMAIL: ${{ secrets.CUPCAL_SUPABASE_PASSWORD_TEST_EMAIL }}
          CUPCAL_SUPABASE_PASSWORD_TEST_PASSWORD: ${{ secrets.CUPCAL_SUPABASE_PASSWORD_TEST_PASSWORD }}
