name: API Server – Fresh Supabase migrations

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fresh-supabase-migrations:
    name: Fresh Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install PostgreSQL tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql postgresql-client
          find /usr/lib/postgresql -type f -name initdb -exec dirname {} \; \
            | sort -V \
            | tail -n 1 >> "$GITHUB_PATH"

      - name: Test Supabase migrations on a fresh database
        run: pnpm --filter @workspace/api-server test:supabase-migrations:fresh
