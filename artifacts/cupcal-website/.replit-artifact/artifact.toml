kind = "web"
previewPath = "/"
title = "CupCal Website"
description = "Die deutschsprachige Vorstellungs- und Downloadseite für CupCal, den Fortnite-Wettbewerbskalender mit Filtern, Favoriten und Offline-Zugriff."
version = "1.0.0"
id = "artifacts/cupcal-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19101

[services.development]
run = "pnpm --filter @workspace/cupcal-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cupcal-website", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/cupcal-website", "run", "serve:production" ]

[services.env]
PORT = "19101"
BASE_PATH = "/"
