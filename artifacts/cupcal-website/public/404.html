<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0b1016" />
    <title>Seite nicht gefunden | CupCal</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0b1016; color: #edf1f5; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 620px); padding: 36px; border: 1px solid #283440; border-radius: 18px; background: #111821; }
      .label { color: #d5f536; font: 700 11px ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 16px 0 12px; font-size: clamp(32px, 8vw, 52px); line-height: 1; }
      p { color: #aab3bf; line-height: 1.65; }
      a { display: inline-flex; min-height: 44px; align-items: center; margin-top: 12px; padding: 0 18px; border-radius: 8px; background: #d5f536; color: #151a0a; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <div class="label">CupCal · 404</div>
      <h1>Diese Seite gibt es nicht.</h1>
      <p>Die Adresse ist möglicherweise veraltet oder falsch geschrieben. Auf der CupCal-Startseite findest du den Kalender und alle Informationen zur App.</p>
      <a href="/">Zur CupCal-Startseite</a>
    </main>
  </body>
</html>
